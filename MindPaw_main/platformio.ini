[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    olikraus/U8g2 @ 2.36.2
    bblanchon/ArduinoJson @ 7.2.0
    arduino-libraries/NTPClient @ 3.2.1
    adafruit/Adafruit PWM Servo Driver Library @ 3.0.2

; A: ESP8266 + ArduCAM Mini 2MP Plus (OV2640, SPI/FIFO) + PCA9685.
[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
lib_deps =
    ${env.lib_deps}
    ESP32Async/ESPAsyncTCP @ 2.0.0
    https://github.com/ArduCAM/Arduino.git#066a7ea1ccae4813e9a9b9d04e55f96bb8b4039e
; Bypass memorysaver.h (upstream defaults to OV5642); select exactly one module.
build_flags = -D_MEMORYSAVER_ -DOV2640_MINI_2MP_PLUS

; B: ESP32-S3-DevKitC-1 N8R8 + OV2640 DVP breakout (no FIFO) + PCA9685.
; Not compatible with the original ESP8266 PCB or ESP32-CAM pinout.
[env:esp32s3_dvp]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    ESP32Async/AsyncTCP @ 3.3.2
