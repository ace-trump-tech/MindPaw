name: Firmware build

on:
  push:
    branches: [main]
    paths:
      - "MindPaw_main/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "MindPaw_main/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [nodemcuv2, esp32s3_dvp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Compile firmware
        run: pio run --project-dir MindPaw_main -e ${{ matrix.environment }}
      - name: Build web filesystem
        run: pio run --project-dir MindPaw_main -e ${{ matrix.environment }} -t buildfs
      - name: Camera pixel and framing tests
        run: |
          g++ -std=c++11 -Wall -Wextra -pedantic tests/camera_pixels_test.cpp -o /tmp/camera_pixels_test
          /tmp/camera_pixels_test
          g++ -std=c++11 -Wall -Wextra -DESP8266 -Itests/camera_stubs tests/camera_spi_test.cpp MindPaw_main/src/ov2640.cpp -o /tmp/camera_spi_test
          /tmp/camera_spi_test
          g++ -std=c++11 -Wall -Wextra -DCONFIG_IDF_TARGET_ESP32S3 -Itests/camera_stubs tests/camera_dvp_test.cpp MindPaw_main/src/ov2640.cpp -o /tmp/camera_dvp_test
          /tmp/camera_dvp_test
          python -m unittest discover -s tests -v
